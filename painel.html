<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel — Minha Loja</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f6f1e9;--paper:#fffdf9;--ink:#22201c;--muted:#8a8378;
      --line:rgba(34,32,28,.12);--terra:#b5651d;--terra-dark:#8f4e14;--green:#2e7d32;--red:#b03030}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
    .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
    header{position:sticky;top:0;z-index:20;background:rgba(246,241,233,.9);
      backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .hd{display:flex;align-items:center;justify-content:space-between;gap:14px;
      padding:15px 20px;max-width:1100px;margin:0 auto}
    .hd .l{display:flex;align-items:center;gap:11px}
    .hd .dot{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--terra),var(--terra-dark))}
    .hd h1{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:600}
    .hd .actions{display:flex;gap:9px}
    .btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);
      padding:9px 15px;border-radius:11px;font-family:inherit;font-weight:600;font-size:.85rem;
      cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
    .btn:hover{border-color:var(--terra)}
    .btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    .btn.danger{color:var(--red)}

    .tabs{display:flex;gap:8px;padding:22px 0 6px}
    .tab{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
      font-weight:600;font-size:.86rem;cursor:pointer;font-family:inherit}
    .tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

    section{display:none;padding:18px 0 80px}
    section.show{display:block}

    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
    .stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
    .stat .n{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:600}
    .stat .t{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

    table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);
      border-radius:16px;overflow:hidden}
    th,td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:middle}
    th{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
    tr:last-child td{border-bottom:none}
    .pthumb{width:48px;height:48px;border-radius:9px;object-fit:cover;background:#ece4d6}
    .pill{font-size:.72rem;padding:4px 9px;border-radius:7px;font-weight:700}
    .pill.on{background:#dff0df;color:var(--green)}.pill.off{background:#f0e0e0;color:var(--red)}
    .rowbtns{display:flex;gap:6px;justify-content:flex-end}
    .ic{border:1px solid var(--line);background:#fff;cursor:pointer;border-radius:9px;
      padding:7px 9px;font-size:.8rem}

    /* form / modal */
    .overlay{position:fixed;inset:0;background:rgba(34,32,28,.4);display:none;
      align-items:center;justify-content:center;z-index:50;padding:18px;backdrop-filter:blur(3px)}
    .overlay.show{display:flex}
    .modal{width:min(100%,520px);max-height:92vh;overflow:auto;background:var(--paper);
      border-radius:22px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
    .modal h2{font-family:'Fraunces',serif;font-size:1.35rem;font-weight:600;margin-bottom:18px}
    label{display:block;font-size:.8rem;font-weight:600;margin:13px 0 5px}
    input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;
      background:#fff;font-family:inherit;font-size:.92rem;color:var(--ink);outline:none}
    input:focus,textarea:focus,select:focus{border-color:var(--terra)}
    textarea{resize:vertical;min-height:70px}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .chk{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:.9rem;font-weight:600}
    .chk input{width:auto}
    .preview{width:100%;aspect-ratio:4/3;border-radius:12px;object-fit:contain;padding:8px;background:#fff;border:1px solid var(--line);margin-top:8px;display:none}
    .modal-foot{display:flex;gap:10px;margin-top:22px}
    .modal-foot .btn{flex:1;justify-content:center;padding:13px}
    .fb{font-size:.85rem;margin-top:10px;min-height:18px}
    .fb.error{color:var(--red)}.fb.success{color:var(--green)}
    .empty{text-align:center;padding:60px 20px;color:var(--muted)}
    @media(max-width:640px){.col-hide{display:none}.hd h1{font-size:1rem}}
  </style>
</head>
<body>
  <header>
    <div class="hd">
      <div class="l"><div class="dot"></div><h1 id="hd-nome">Painel</h1></div>
      <div class="actions">
        <a class="btn" href="index.html" target="_blank">Ver vitrine ↗</a>
        <button class="btn" id="sair">Sair</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="tabs">
      <button class="tab active" data-tab="prod">Produtos</button>
      <button class="tab" data-tab="loja">Dados da loja</button>
    </div>

    <!-- PRODUTOS -->
    <section id="sec-prod" class="show">
      <div class="stats" id="stats"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h2 style="font-family:'Fraunces',serif;font-weight:600;font-size:1.2rem">Seus produtos</h2>
        <button class="btn primary" id="novo">+ Novo produto</button>
      </div>
      <div id="lista"></div>
    </section>

    <!-- LOJA -->
    <section id="sec-loja">
      <div class="modal" style="margin:0;box-shadow:none;border:1px solid var(--line);max-width:560px">
        <h2>Dados da loja</h2>
        <label>Nome da loja</label>
        <input id="l-nome" placeholder="Ex.: Loja da Fulana" />
        <label>WhatsApp (com DDI e DDD, só números)</label>
        <input id="l-wpp" placeholder="5562999999999" inputmode="numeric" />
        <label>Descrição / frase da vitrine</label>
        <textarea id="l-desc" placeholder="Produtos selecionados com carinho."></textarea>
        <label>Cor do tema</label>
        <input id="l-cor" type="color" value="#b5651d" style="height:46px;padding:4px" />
        <button class="btn primary" id="salvar-loja" style="margin-top:20px;width:100%;justify-content:center;padding:13px">Salvar dados da loja</button>
        <div class="fb" id="fb-loja"></div>
      </div>
    </section>
  </main>

  <!-- MODAL PRODUTO -->
  <div class="overlay" id="ov">
    <div class="modal">
      <h2 id="modal-titulo">Novo produto</h2>
      <input type="hidden" id="p-id" />
      <label>Nome *</label>
      <input id="p-nome" placeholder="Ex.: Perfume Importado 100ml" />
      <div class="row2">
        <div><label>Preço (R$) *</label><input id="p-preco" type="number" step="0.01" min="0" placeholder="199.90" /></div>
        <div><label>Estoque</label><input id="p-estoque" type="number" min="0" value="1" /></div>
      </div>
      <label>Categoria</label>
      <input id="p-cat" list="cats" placeholder="Ex.: Perfumes" />
      <datalist id="cats">
        <option>Casa</option><option>Perfumes</option><option>Eletrônicos</option>
        <option>Notebooks</option><option>Memórias</option><option>SSD</option><option>Geral</option>
      </datalist>
      <label>Descrição</label>
      <textarea id="p-desc" placeholder="Detalhes do produto…"></textarea>
      <label>Foto do produto</label>
      <input id="p-file" type="file" accept="image/*" />
      <img id="p-prev" class="preview" alt="" />
      <div class="row2" style="margin-top:4px">
        <label class="chk"><input id="p-ativo" type="checkbox" checked /> Visível na vitrine</label>
        <label class="chk"><input id="p-destaque" type="checkbox" /> Marcar como destaque</label>
      </div>
      <div class="fb" id="fb-prod"></div>
      <div class="modal-foot">
        <button class="btn" id="cancelar">Cancelar</button>
        <button class="btn primary" id="salvar">Salvar produto</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="painel.js"></script>
</body>
</html>
